# ========================================
# Docker Compose — NaukriScrap
# ========================================
# Services:
#   api       — Backend Express API
#   frontend  — React/Vite frontend (nginx)
#   redis     — Redis Stack (cache + BullMQ broker)
#   worker    — BullMQ scraping workers (4 replicas)
#   ai-worker — AI match scoring worker (Queue 2)
#   db        — MongoDB
# ========================================

services:
  # ---- Backend API ----
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: naukri-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=dev
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://db:27017/naukri_jobs
      - CORS_ORIGINS=http://localhost:5001
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - naukri-network

  # ---- Worker (Job Match & Filter) ----
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules
    deploy:
      replicas: 4
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=dev
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://db:27017/naukri_jobs
      - SKIP_AI_WORKER=true
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - naukri-network

  # ---- AI Match Worker (Queue 2) ----
  ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.ai-worker
    container_name: naukri-ai-worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=dev
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://db:27017/naukri_jobs
      - OLLAMA_URL=http://host.docker.internal:1234
      - OLLAMA_MODEL=qwen/qwen2.5-vl-7b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - naukri-network

  # ---- Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: naukri-frontend
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:3000/api
    depends_on:
      - api
    networks:
      - naukri-network

  # ---- Redis Stack ----
  redis:
    image: redis/redis-stack:latest
    container_name: naukri-redis
    restart: unless-stopped
    ports:
      - "6379:6379"   # Redis server
      - "8001:8001"   # RedisInsight UI
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - naukri-network

  # ---- MongoDB (commented — using cloud Atlas for now) ----
  db:
    image: mongo:latest
    container_name: naukri-mongo
    restart: unless-stopped
    ports:
      - "27016:27017"
    environment:
      MONGODB_URI: "mongodb://mongo:27016/naukri_jobs"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - naukri-network

networks:
  naukri-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  mongo-data:
    driver: local
